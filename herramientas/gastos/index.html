<!DOCTYPE html>
<html lang="es" class="h-full bg-[#050914] text-slate-100 selection:bg-blue-500 selection:text-slate-950">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Divisor de Gastos · LaRanchada Web</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Poppins', sans-serif;
      background-color: #050914;
      background-image:
        radial-gradient(ellipse 80% 50% at 15% -10%, rgba(59,130,246,0.20), transparent),
        radial-gradient(ellipse 60% 40% at 100% 10%, rgba(56,189,248,0.14), transparent),
        radial-gradient(ellipse 70% 50% at 50% 120%, rgba(37,99,235,0.16), transparent);
      background-attachment: fixed;
    }
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background: repeating-radial-gradient(circle at 0 0, rgba(255,255,255,.015) 0, rgba(255,255,255,.015) 1px, transparent 2px, transparent 4px);
      opacity: .7;
    }
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(59,130,246,0.35); border-radius: 999px; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(59,130,246,0.55); }
    .glow-card {
      box-shadow: 0 0 0 1px rgba(59,130,246,0.06), 0 20px 60px -20px rgba(37,99,235,0.35);
    }
  </style>
</head>
<body class="min-h-full flex flex-col p-4 sm:p-6 lg:p-8 relative">

  <!-- Header -->
  <header class="max-w-3xl w-full mx-auto flex justify-between items-center pb-4 sm:pb-6 border-b border-slate-800">
    <a href="/" class="flex items-center gap-2 text-slate-400 hover:text-white transition group">
      <svg class="w-4 h-4 group-hover:-translate-x-0.5 transition" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>
      <span class="text-[10px] sm:text-xs font-semibold tracking-wider uppercase">Inicio</span>
    </a>
    <button onclick="clearAll()" class="text-[11px] sm:text-xs px-3 py-1.5 bg-red-500/10 border border-red-500/30 text-red-400 hover:bg-red-500/20 rounded-lg transition">
      🗑️ Borrar todo
    </button>
  </header>

  <main class="max-w-3xl w-full mx-auto flex-1 py-6 sm:py-10 space-y-6">

    <!-- Title -->
    <div class="text-center">
      <div class="inline-flex items-center gap-2 px-3 py-1 mb-3 text-[10px] sm:text-xs font-semibold uppercase tracking-widest text-blue-300 bg-blue-500/10 border border-blue-500/25 rounded-full">
        <span class="relative flex h-2 w-2">
          <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-sky-400 opacity-75"></span>
          <span class="relative inline-flex rounded-full h-2 w-2 bg-sky-500"></span>
        </span>
        Herramienta
      </div>
      <h1 class="text-2xl sm:text-3xl font-extrabold text-white">Divisor de Gastos</h1>
      <p class="mt-1 text-xs sm:text-sm text-slate-500">Para que nadie se haga el boludo con la plata</p>
    </div>

    <!-- Participantes -->
    <section class="glow-card bg-slate-900/60 border border-slate-800 rounded-2xl p-4 sm:p-5">
      <div class="flex items-center justify-between mb-3">
        <h2 class="text-sm font-bold text-white">Participantes</h2>
        <button onclick="toggleEditPeople()" class="text-xs text-blue-400 hover:text-blue-300">Editar</button>
      </div>
      <div id="people-chips" class="flex flex-wrap gap-2"></div>
      <div id="edit-people" class="hidden mt-3 space-y-2">
        <input id="new-person" type="text" placeholder="Nombre nuevo..." class="w-full bg-slate-950 border border-slate-700 rounded-xl px-3 py-2 text-sm focus:outline-none focus:border-blue-500">
        <div class="flex gap-2">
          <button onclick="addPerson()" class="flex-1 py-2 bg-blue-600 hover:bg-blue-500 text-white text-sm font-semibold rounded-xl">Agregar</button>
          <button onclick="toggleEditPeople()" class="px-4 py-2 bg-slate-800 text-slate-300 text-sm rounded-xl">Listo</button>
        </div>
      </div>
    </section>

    <!-- Agregar gasto -->
    <section class="glow-card bg-slate-900/60 border border-slate-800 rounded-2xl p-4 sm:p-5 space-y-3">
      <h2 class="text-sm font-bold text-white">Agregar gasto</h2>
      <input id="expense-desc" type="text" placeholder="¿Qué se compró? (ej: Asado, Birras, Uber)" class="w-full bg-slate-950 border border-slate-700 rounded-xl px-3 py-2.5 text-sm focus:outline-none focus:border-blue-500">
      <div class="grid grid-cols-2 gap-3">
        <input id="expense-amount" type="number" inputmode="decimal" placeholder="Monto $" class="w-full bg-slate-950 border border-slate-700 rounded-xl px-3 py-2.5 text-sm focus:outline-none focus:border-blue-500">
        <select id="expense-payer" class="w-full bg-slate-950 border border-slate-700 rounded-xl px-3 py-2.5 text-sm focus:outline-none focus:border-blue-500"></select>
      </div>
      <button onclick="addExpense()" class="w-full py-3 bg-blue-600 hover:bg-blue-500 active:scale-[0.98] text-white font-bold rounded-xl transition">
        + Agregar gasto
      </button>
    </section>

    <!-- Lista de gastos -->
    <section class="glow-card bg-slate-900/60 border border-slate-800 rounded-2xl p-4 sm:p-5">
      <h2 class="text-sm font-bold text-white mb-3">Gastos cargados</h2>
      <div id="expenses-list" class="space-y-2 max-h-64 overflow-y-auto"></div>
      <p id="no-expenses" class="text-center text-slate-500 text-sm py-6">Todavía no hay gastos</p>
    </section>

    <!-- Resumen -->
    <section class="glow-card bg-slate-900/60 border border-blue-900/40 rounded-2xl p-4 sm:p-5">
      <div class="flex items-center justify-between mb-4">
        <h2 class="text-sm font-bold text-white">Resumen de deudas</h2>
        <button onclick="copySummary()" class="text-xs px-3 py-1.5 bg-emerald-500/10 border border-emerald-500/30 text-emerald-400 hover:bg-emerald-500/20 rounded-lg transition">
          📋 Copiar
        </button>
      </div>
      <div id="balances" class="space-y-2"></div>
      <div id="settlements" class="mt-4 space-y-2 border-t border-slate-800 pt-4"></div>
    </section>

  </main>

  <footer class="max-w-3xl w-full mx-auto pt-4 border-t border-slate-800 text-center">
    <p class="text-[10px] sm:text-xs text-slate-600">LaRanchada Web · Hecho con 💙 por Perico</p>
  </footer>

  <script>
    const DEFAULT_PEOPLE = [
      "Perico", "Tito", "Palomo", "Ponce", "Ogro", "Degas",
      "Bashe", "Lolo", "Juli", "Gabo", "Narigon", "Nicolais", "Tomasa"
    ];

    let people = [];
    let expenses = [];

    function load() {
      const savedPeople = localStorage.getItem("ranchada_people");
      const savedExpenses = localStorage.getItem("ranchada_expenses");
      people = savedPeople ? JSON.parse(savedPeople) : [...DEFAULT_PEOPLE];
      expenses = savedExpenses ? JSON.parse(savedExpenses) : [];
      render();
    }

    function save() {
      localStorage.setItem("ranchada_people", JSON.stringify(people));
      localStorage.setItem("ranchada_expenses", JSON.stringify(expenses));
    }

    function render() {
      const chips = document.getElementById("people-chips");
      chips.innerHTML = people.map(p => `
        <span class="inline-flex items-center gap-1 px-3 py-1 bg-slate-800 border border-slate-700 rounded-full text-xs font-medium">
          ${p}
          <button onclick="removePerson('${p}')" class="text-slate-500 hover:text-red-400 ml-1">×</button>
        </span>
      `).join("");

      const select = document.getElementById("expense-payer");
      select.innerHTML = people.map(p => `<option value="${p}">${p}</option>`).join("");

      const list = document.getElementById("expenses-list");
      const noExp = document.getElementById("no-expenses");
      if (expenses.length === 0) {
        list.innerHTML = "";
        noExp.classList.remove("hidden");
      } else {
        noExp.classList.add("hidden");
        list.innerHTML = expenses.map((e, i) => `
          <div class="flex items-center justify-between bg-slate-950/70 border border-slate-800 rounded-xl px-3 py-2.5">
            <div class="min-w-0">
              <p class="text-sm font-medium text-white truncate">${e.desc}</p>
              <p class="text-xs text-slate-400">Pagó <span class="text-blue-400">${e.payer}</span></p>
            </div>
            <div class="flex items-center gap-3 shrink-0">
              <span class="text-sm font-bold text-emerald-400">$${e.amount.toLocaleString("es-AR")}</span>
              <button onclick="removeExpense(${i})" class="text-slate-500 hover:text-red-400 text-lg leading-none">×</button>
            </div>
          </div>
        `).join("");
      }

      calculateBalances();
    }

    function calculateBalances() {
      const balances = {};
      people.forEach(p => balances[p] = 0);

      expenses.forEach(e => {
        const share = e.amount / people.length;
        people.forEach(p => {
          if (p === e.payer) {
            balances[p] += e.amount - share;
          } else {
            balances[p] -= share;
          }
        });
      });

      const balDiv = document.getElementById("balances");
      balDiv.innerHTML = people.map(p => {
        const b = balances[p];
        const color = b > 0.5 ? "text-emerald-400" : b < -0.5 ? "text-red-400" : "text-slate-400";
        const text = b > 0.5 ? `+$${Math.round(b).toLocaleString("es-AR")}` :
                     b < -0.5 ? `-$${Math.abs(Math.round(b)).toLocaleString("es-AR")}` : "$0";
        return `<div class="flex justify-between text-sm"><span>${p}</span><span class="${color} font-semibold">${text}</span></div>`;
      }).join("");

      const debtors = [];
      const creditors = [];
      Object.entries(balances).forEach(([name, amount]) => {
        if (amount < -0.5) debtors.push({ name, amount: -amount });
        if (amount > 0.5) creditors.push({ name, amount });
      });

      debtors.sort((a, b) => b.amount - a.amount);
      creditors.sort((a, b) => b.amount - a.amount);

      const settlements = [];
      let i = 0, j = 0;
      while (i < debtors.length && j < creditors.length) {
        const pay = Math.min(debtors[i].amount, creditors[j].amount);
        settlements.push({
          from: debtors[i].name,
          to: creditors[j].name,
          amount: Math.round(pay)
        });
        debtors[i].amount -= pay;
        creditors[j].amount -= pay;
        if (debtors[i].amount < 0.5) i++;
        if (creditors[j].amount < 0.5) j++;
      }

      const setDiv = document.getElementById("settlements");
      if (settlements.length === 0) {
        setDiv.innerHTML = `<p class="text-center text-slate-500 text-sm">Todo saldado 🎉</p>`;
      } else {
        setDiv.innerHTML = `<p class="text-xs text-slate-400 mb-2 font-medium">Cómo liquidar:</p>` +
          settlements.map(s => `
            <div class="flex items-center justify-between bg-slate-950/60 border border-slate-800 rounded-xl px-3 py-2.5">
              <span class="text-sm"><span class="text-red-400 font-medium">${s.from}</span> le debe a <span class="text-emerald-400 font-medium">${s.to}</span></span>
              <span class="text-sm font-bold text-white">$${s.amount.toLocaleString("es-AR")}</span>
            </div>
          `).join("");
      }
    }

    function addExpense() {
      const desc = document.getElementById("expense-desc").value.trim();
      const amount = parseFloat(document.getElementById("expense-amount").value);
      const payer = document.getElementById("expense-payer").value;

      if (!desc || isNaN(amount) || amount <= 0) {
        alert("Completá la descripción y un monto válido");
        return;
      }

      expenses.push({ desc, amount, payer });
      document.getElementById("expense-desc").value = "";
      document.getElementById("expense-amount").value = "";
      save();
      render();
    }

    function removeExpense(index) {
      expenses.splice(index, 1);
      save();
      render();
    }

    function addPerson() {
      const name = document.getElementById("new-person").value.trim();
      if (!name || people.includes(name)) return;
      people.push(name);
      document.getElementById("new-person").value = "";
      save();
      render();
    }

    function removePerson(name) {
      if (people.length <= 1) return;
      people = people.filter(p => p !== name);
      expenses = expenses.filter(e => e.payer !== name);
      save();
      render();
    }

    function toggleEditPeople() {
      document.getElementById("edit-people").classList.toggle("hidden");
    }

    function clearAll() {
      if (!confirm("¿Borrar todos los gastos y reiniciar participantes?")) return;
      people = [...DEFAULT_PEOPLE];
      expenses = [];
      save();
      render();
    }

    function copySummary() {
      const balances = {};
      people.forEach(p => balances[p] = 0);
      expenses.forEach(e => {
        const share = e.amount / people.length;
        people.forEach(p => {
          if (p === e.payer) balances[p] += e.amount - share;
          else balances[p] -= share;
        });
      });

      let text = "💰 *Resumen de gastos - La Ranchada*\\n\\n";
      text += "*Gastos:*\\n";
      expenses.forEach(e => {
        text += `• ${e.desc}: $${e.amount.toLocaleString("es-AR")} (pagó ${e.payer})\\n`;
      });
      text += "\\n*Cómo liquidar:*\\n";

      const debtors = [], creditors = [];
      Object.entries(balances).forEach(([name, amount]) => {
        if (amount < -0.5) debtors.push({ name, amount: -amount });
        if (amount > 0.5) creditors.push({ name, amount });
      });
      debtors.sort((a,b) => b.amount - a.amount);
      creditors.sort((a,b) => b.amount - a.amount);

      let i=0, j=0;
      while (i < debtors.length && j < creditors.length) {
        const pay = Math.min(debtors[i].amount, creditors[j].amount);
        text += `• ${debtors[i].name} le debe $${Math.round(pay).toLocaleString("es-AR")} a ${creditors[j].name}\\n`;
        debtors[i].amount -= pay;
        creditors[j].amount -= pay;
        if (debtors[i].amount < 0.5) i++;
        if (creditors[j].amount < 0.5) j++;
      }

      if (debtors.length === 0 && creditors.length === 0) text += "Todo saldado 🎉\\n";

      navigator.clipboard.writeText(text).then(() => {
        alert("¡Resumen copiado! Pegalo en el grupo");
      }).catch(() => {
        prompt("Copiá este texto:", text);
      });
    }

    document.getElementById("expense-amount").addEventListener("keydown", e => {
      if (e.key === "Enter") addExpense();
    });
    document.getElementById("expense-desc").addEventListener("keydown", e => {
      if (e.key === "Enter") document.getElementById("expense-amount").focus();
    });

    load();
  </script>
</body>
</html>
