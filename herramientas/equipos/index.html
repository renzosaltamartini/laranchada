<!DOCTYPE html>
<html lang="es" class="h-full bg-[#050914] text-slate-100 selection:bg-blue-500 selection:text-slate-950">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Equipos · LaRanchada Web</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Poppins', sans-serif;
      background-color: #050914;
      background-image:
        radial-gradient(ellipse 80% 50% at 15% -10%, rgba(59,130,246,0.20), transparent),
        radial-gradient(ellipse 60% 40% at 100% 10%, rgba(56,189,248,0.14), transparent),
        radial-gradient(ellipse 70% 50% at 50% 120%, rgba(37,99,235,0.16), transparent);
      background-attachment: fixed;
    }
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background: repeating-radial-gradient(circle at 0 0, rgba(255,255,255,.015) 0, rgba(255,255,255,.015) 1px, transparent 2px, transparent 4px);
      opacity: .7;
    }
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(59,130,246,0.35); border-radius: 999px; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(59,130,246,0.55); }
    .glow-card {
      box-shadow: 0 0 0 1px rgba(59,130,246,0.06), 0 20px 60px -20px rgba(37,99,235,0.35);
    }
  </style>
</head>
<body class="min-h-full flex flex-col p-4 sm:p-6 lg:p-8 relative">

  <!-- Header -->
  <header class="max-w-3xl w-full mx-auto flex justify-between items-center pb-4 sm:pb-6 border-b border-slate-800">
    <a href="/" class="flex items-center gap-2 text-slate-400 hover:text-white transition group">
      <svg class="w-4 h-4 group-hover:-translate-x-0.5 transition" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>
      <span class="text-[10px] sm:text-xs font-semibold tracking-wider uppercase">Inicio</span>
    </a>
    <button onclick="clearAll()" class="text-[11px] sm:text-xs px-3 py-1.5 bg-red-500/10 border border-red-500/30 text-red-400 hover:bg-red-500/20 rounded-lg transition">
      🗑️ Borrar todo
    </button>
  </header>

  <main class="max-w-3xl w-full mx-auto flex-1 py-6 sm:py-10 space-y-6">

    <!-- ========== PANTALLA INICIAL ========== -->
    <div id="screen-home">
      <div class="text-center mb-8">
        <div class="inline-flex items-center gap-2 px-3 py-1 mb-3 text-[10px] sm:text-xs font-semibold uppercase tracking-widest text-blue-300 bg-blue-500/10 border border-blue-500/25 rounded-full">
          <span class="relative flex h-2 w-2">
            <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-sky-400 opacity-75"></span>
            <span class="relative inline-flex rounded-full h-2 w-2 bg-sky-500"></span>
          </span>
          Herramienta
        </div>
        <h1 class="text-2xl sm:text-3xl font-extrabold text-white">Armador de Equipos</h1>
        <p class="mt-1 text-xs sm:text-sm text-slate-500">Elegí qué vas a jugar</p>
      </div>

      <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
        <!-- Truco -->
        <button onclick="selectSport('truco')" class="glow-card group bg-slate-900/60 hover:bg-slate-900 border border-slate-800 hover:border-blue-500/50 rounded-2xl p-6 text-left transition-all active:scale-[0.98]">
          <div class="w-12 h-12 rounded-xl bg-blue-500/10 border border-blue-500/25 flex items-center justify-center text-2xl mb-4">
            🃏
          </div>
          <h2 class="text-lg font-bold text-white mb-1">Truco</h2>
          <p class="text-xs text-slate-400">2v2 o 3v3 · arma varios partidos si hay mucha gente</p>
        </button>

        <!-- Papi -->
        <button onclick="selectSport('papi')" class="glow-card group bg-slate-900/60 hover:bg-slate-900 border border-slate-800 hover:border-emerald-500/50 rounded-2xl p-6 text-left transition-all active:scale-[0.98]">
          <div class="w-12 h-12 rounded-xl bg-emerald-500/10 border border-emerald-500/25 flex items-center justify-center text-2xl mb-4">
            ⚽
          </div>
          <h2 class="text-lg font-bold text-white mb-1">Papi</h2>
          <p class="text-xs text-slate-400">Divide a todos en 2 equipos parejos</p>
        </button>
      </div>
    </div>

    <!-- ========== PANTALLA DE ARMADO ========== -->
    <div id="screen-build" class="hidden space-y-6">

      <!-- Título dinámico -->
      <div class="text-center">
        <button onclick="goHome()" class="text-xs text-slate-500 hover:text-slate-300 mb-3 inline-flex items-center gap-1">
          ← Cambiar
        </button>
        <h1 id="build-title" class="text-2xl sm:text-3xl font-extrabold text-white"></h1>
        <p id="build-subtitle" class="mt-1 text-xs sm:text-sm text-slate-500"></p>
      </div>

      <!-- Participantes -->
      <section class="glow-card bg-slate-900/60 border border-slate-800 rounded-2xl p-4 sm:p-5">
        <div class="flex items-center justify-between mb-3">
          <h2 class="text-sm font-bold text-white">Participantes</h2>
          <button onclick="toggleEditPeople()" class="text-xs text-blue-400 hover:text-blue-300 font-medium">
            + Agregar
          </button>
        </div>

        <div id="people-chips" class="flex flex-wrap gap-2 min-h-[32px]"></div>

        <p id="no-people-msg" class="text-center text-slate-500 text-sm py-3 hidden">
          Todavía no hay nadie. Agregá a los que van a jugar.
        </p>

        <div id="edit-people" class="hidden mt-3 space-y-2">
          <input id="new-person" type="text" placeholder="Nombre..." class="w-full bg-slate-950 border border-slate-700 rounded-xl px-3 py-2.5 text-sm focus:outline-none focus:border-blue-500" autocomplete="off">
          <div class="flex gap-2">
            <button onclick="addPerson()" class="flex-1 py-2.5 bg-blue-600 hover:bg-blue-500 text-white text-sm font-semibold rounded-xl transition">
              Agregar persona
            </button>
            <button onclick="toggleEditPeople()" class="px-4 py-2.5 bg-slate-800 hover:bg-slate-700 text-slate-300 text-sm rounded-xl transition">
              Listo
            </button>
          </div>
        </div>
      </section>

      <!-- Solo para Truco: selector 2v2 / 3v3 -->
      <section id="truco-mode-section" class="hidden glow-card bg-slate-900/60 border border-slate-800 rounded-2xl p-4 sm:p-5">
        <h2 class="text-sm font-bold text-white mb-3">Modalidad</h2>
        <div class="grid grid-cols-2 gap-3">
          <button id="btn-2v2" onclick="setTrucoMode('2v2')" class="mode-btn py-3 rounded-xl font-bold text-sm border transition">
            2 vs 2
          </button>
          <button id="btn-3v3" onclick="setTrucoMode('3v3')" class="mode-btn py-3 rounded-xl font-bold text-sm border transition">
            3 vs 3
          </button>
        </div>
        <p id="mode-hint" class="text-xs text-slate-500 mt-3 text-center"></p>
      </section>

      <!-- Botón generar -->
      <button id="generate-btn" onclick="generate()" class="w-full py-3.5 bg-blue-600 hover:bg-blue-500 active:scale-[0.98] text-white font-bold rounded-xl transition disabled:opacity-40 disabled:cursor-not-allowed">
        🔀 Armar equipos
      </button>

      <!-- Resultado -->
      <section id="result-section" class="hidden space-y-4">
        <div class="glow-card bg-slate-900/60 border border-blue-900/40 rounded-2xl p-4 sm:p-5">
          <div class="flex items-center justify-between mb-4">
            <h2 class="text-sm font-bold text-white">Resultado</h2>
            <div class="flex gap-2">
              <button onclick="generate()" class="text-xs px-3 py-1.5 bg-slate-800 hover:bg-slate-700 border border-slate-700 text-slate-300 rounded-lg transition">
                🔄 Otra vez
              </button>
              <button onclick="copyResult()" class="text-xs px-3 py-1.5 bg-emerald-500/10 border border-emerald-500/30 text-emerald-400 hover:bg-emerald-500/20 rounded-lg transition">
                📋 Copiar
              </button>
            </div>
          </div>

          <div id="result-content" class="space-y-4"></div>
        </div>
      </section>
    </div>

  </main>

  <footer class="max-w-3xl w-full mx-auto pt-4 border-t border-slate-800 text-center">
    <p class="text-[10px] sm:text-xs text-slate-600">LaRanchada Web · Hecho con 💙 por Perico</p>
  </footer>

  <script>
    let people = [];
    let currentSport = null;      // "truco" | "papi"
    let trucoMode = "2v2";        // "2v2" | "3v3"
    let lastResult = null;

    // ========== INICIALIZACIÓN ==========
    function load() {
      const saved = localStorage.getItem("ranchada_equipos_people");
      people = saved ? JSON.parse(saved) : [];
      renderPeople();
    }

    function save() {
      localStorage.setItem("ranchada_equipos_people", JSON.stringify(people));
    }

    // ========== NAVEGACIÓN ==========
    function selectSport(sport) {
      currentSport = sport;
      document.getElementById("screen-home").classList.add("hidden");
      document.getElementById("screen-build").classList.remove("hidden");
      document.getElementById("result-section").classList.add("hidden");
      lastResult = null;

      if (sport === "truco") {
        document.getElementById("build-title").textContent = "Equipos";
        document.getElementById("build-subtitle").textContent = "2v2 o 3v3 · arma varios partidos si hay mucha gente";
        document.getElementById("truco-mode-section").classList.remove("hidden");
        setTrucoMode("2v2");
      } else {
        document.getElementById("build-title").textContent = "Equipos";
        document.getElementById("build-subtitle").textContent = "Divide a todos en 2 equipos parejos";
        document.getElementById("truco-mode-section").classList.add("hidden");
      }

      updateGenerateButton();
    }

    function goHome() {
      currentSport = null;
      document.getElementById("screen-home").classList.remove("hidden");
      document.getElementById("screen-build").classList.add("hidden");
      document.getElementById("result-section").classList.add("hidden");
      lastResult = null;
    }

    // ========== PARTICIPANTES ==========
    function renderPeople() {
      const chips = document.getElementById("people-chips");
      const noPeopleMsg = document.getElementById("no-people-msg");

      if (people.length === 0) {
        chips.innerHTML = "";
        noPeopleMsg.classList.remove("hidden");
      } else {
        noPeopleMsg.classList.add("hidden");
        chips.innerHTML = people.map(p => `
          <span class="inline-flex items-center gap-1.5 px-3 py-1.5 bg-slate-800 border border-slate-700 rounded-full text-xs font-medium">
            ${p}
            <button onclick="removePerson('${p}')" class="text-slate-500 hover:text-red-400 leading-none text-sm">×</button>
          </span>
        `).join("");
      }

      updateGenerateButton();
      updateModeHint();
    }

    function addPerson() {
      const input = document.getElementById("new-person");
      const name = input.value.trim();
      if (!name) return;
      if (people.includes(name)) {
        alert("Esa persona ya está agregada");
        return;
      }
      people.push(name);
      input.value = "";
      input.focus();
      save();
      renderPeople();
    }

    function removePerson(name) {
      people = people.filter(p => p !== name);
      save();
      renderPeople();
      document.getElementById("result-section").classList.add("hidden");
      lastResult = null;
    }

    function toggleEditPeople() {
      const panel = document.getElementById("edit-people");
      panel.classList.toggle("hidden");
      if (!panel.classList.contains("hidden")) {
        document.getElementById("new-person").focus();
      }
    }

    function clearAll() {
      if (!confirm("¿Borrar todos los participantes?")) return;
      people = [];
      lastResult = null;
      save();
      renderPeople();
      document.getElementById("result-section").classList.add("hidden");
    }

    // ========== TRUCO MODE ==========
    function setTrucoMode(mode) {
      trucoMode = mode;
      const btn2 = document.getElementById("btn-2v2");
      const btn3 = document.getElementById("btn-3v3");

      if (mode === "2v2") {
        btn2.className = "mode-btn py-3 rounded-xl font-bold text-sm border transition bg-blue-600 border-blue-500 text-white";
        btn3.className = "mode-btn py-3 rounded-xl font-bold text-sm border transition bg-slate-950 border-slate-700 text-slate-400 hover:border-slate-600";
      } else {
        btn3.className = "mode-btn py-3 rounded-xl font-bold text-sm border transition bg-blue-600 border-blue-500 text-white";
        btn2.className = "mode-btn py-3 rounded-xl font-bold text-sm border transition bg-slate-950 border-slate-700 text-slate-400 hover:border-slate-600";
      }

      updateGenerateButton();
      updateModeHint();
      document.getElementById("result-section").classList.add("hidden");
      lastResult = null;
    }

    function updateModeHint() {
      if (currentSport !== "truco") return;
      const hint = document.getElementById("mode-hint");
      const teamSize = trucoMode === "2v2" ? 2 : 3;
      const minPeople = teamSize * 2;

      if (people.length === 0) {
        hint.textContent = `Necesitás al menos ${minPeople} personas`;
      } else if (people.length < minPeople) {
        hint.textContent = `Faltan ${minPeople - people.length} (mínimo ${minPeople})`;
      } else {
        const fullTeams = Math.floor(people.length / teamSize);
        const sitOut = people.length % teamSize;
        let msg = `${people.length} personas → ${fullTeams} equipo${fullTeams > 1 ? "s" : ""} de ${teamSize}`;
        if (sitOut > 0) msg += ` · ${sitOut} queda${sitOut > 1 ? "n" : ""} afuera`;
        hint.textContent = msg;
      }
    }

    function updateGenerateButton() {
      const btn = document.getElementById("generate-btn");
      if (!currentSport) {
        btn.disabled = true;
        return;
      }

      if (currentSport === "papi") {
        btn.disabled = people.length < 2;
      } else {
        const min = trucoMode === "2v2" ? 4 : 6;
        btn.disabled = people.length < min;
      }
    }

    // ========== GENERAR ==========
    function shuffle(arr) {
      const a = [...arr];
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }

    function generate() {
      if (currentSport === "truco") {
        generateTruco();
      } else {
        generatePapi();
      }
    }

    function generateTruco() {
      const teamSize = trucoMode === "2v2" ? 2 : 3;
      const minPeople = teamSize * 2;

      if (people.length < minPeople) {
        alert(`Necesitás al menos ${minPeople} personas para ${trucoMode}`);
        return;
      }

      const shuffled = shuffle(people);
      const fullTeamsCount = Math.floor(shuffled.length / teamSize);
      const teams = [];
      let idx = 0;

      for (let t = 0; t < fullTeamsCount; t++) {
        teams.push(shuffled.slice(idx, idx + teamSize));
        idx += teamSize;
      }

      const sitOut = shuffled.slice(idx);

      // Emparejar equipos en partidos
      const matches = [];
      const teamPool = shuffle(teams); // mezclar el orden de los equipos también

      for (let i = 0; i < teamPool.length - 1; i += 2) {
        matches.push({
          teamA: teamPool[i],
          teamB: teamPool[i + 1]
        });
      }

      // Si queda un equipo impar, se suma a "esperando"
      const waitingTeam = teamPool.length % 2 === 1 ? teamPool[teamPool.length - 1] : null;

      lastResult = {
        type: "truco",
        mode: trucoMode,
        matches,
        waitingTeam,
        sitOut
      };

      renderTrucoResult();
    }

    function generatePapi() {
      if (people.length < 2) {
        alert("Necesitás al menos 2 personas");
        return;
      }

      const shuffled = shuffle(people);
      const mid = Math.ceil(shuffled.length / 2);
      const team1 = shuffled.slice(0, mid);
      const team2 = shuffled.slice(mid);

      lastResult = {
        type: "papi",
        team1,
        team2
      };

      renderPapiResult();
    }

    // ========== RENDER RESULTADOS ==========
    function renderTrucoResult() {
      const { matches, waitingTeam, sitOut, mode } = lastResult;
      let html = "";

      matches.forEach((m, i) => {
        html += `
          <div class="bg-slate-950/70 border border-slate-800 rounded-2xl p-4">
            <p class="text-xs font-semibold text-slate-400 mb-3 uppercase tracking-wider">Partido ${i + 1}</p>
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
              <div class="bg-slate-900/80 border border-blue-500/30 rounded-xl p-3">
                <div class="flex items-center gap-2 mb-2">
                  <span class="w-6 h-6 rounded-full bg-blue-500/20 border border-blue-500/40 flex items-center justify-center text-xs font-bold text-blue-400">A</span>
                  <span class="text-xs font-bold text-blue-400">Equipo A</span>
                </div>
                <div class="space-y-1.5">
                  ${m.teamA.map(p => `<div class="text-sm text-white pl-1">• ${p}</div>`).join("")}
                </div>
              </div>
              <div class="bg-slate-900/80 border border-cyan-500/30 rounded-xl p-3">
                <div class="flex items-center gap-2 mb-2">
                  <span class="w-6 h-6 rounded-full bg-cyan-500/20 border border-cyan-500/40 flex items-center justify-center text-xs font-bold text-cyan-400">B</span>
                  <span class="text-xs font-bold text-cyan-400">Equipo B</span>
                </div>
                <div class="space-y-1.5">
                  ${m.teamB.map(p => `<div class="text-sm text-white pl-1">• ${p}</div>`).join("")}
                </div>
              </div>
            </div>
          </div>
        `;
      });

      if (waitingTeam) {
        html += `
          <div class="bg-slate-950/50 border border-slate-800 rounded-2xl p-4">
            <p class="text-xs font-semibold text-amber-400/80 mb-2">⏳ Esperando rival</p>
            <div class="flex flex-wrap gap-2">
              ${waitingTeam.map(p => `<span class="px-3 py-1 bg-slate-800 border border-slate-700 rounded-full text-xs text-slate-300">${p}</span>`).join("")}
            </div>
          </div>
        `;
      }

      if (sitOut.length > 0) {
        html += `
          <div class="pt-2">
            <p class="text-xs text-slate-500 mb-2">Quedan afuera:</p>
            <div class="flex flex-wrap gap-2">
              ${sitOut.map(p => `<span class="px-3 py-1 bg-slate-800/60 border border-slate-700/60 rounded-full text-xs text-slate-500">${p}</span>`).join("")}
            </div>
          </div>
        `;
      }

      document.getElementById("result-content").innerHTML = html;
      document.getElementById("result-section").classList.remove("hidden");
    }

    function renderPapiResult() {
      const { team1, team2 } = lastResult;

      const html = `
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <div class="bg-slate-950/70 border border-blue-500/30 rounded-2xl p-4">
            <div class="flex items-center gap-2 mb-3">
              <div class="w-8 h-8 rounded-full bg-blue-500/20 border border-blue-500/40 flex items-center justify-center text-sm font-bold text-blue-400">1</div>
              <h3 class="font-bold text-white">Equipo 1</h3>
              <span class="text-xs text-slate-500 ml-auto">${team1.length}</span>
            </div>
            <div class="space-y-2">
              ${team1.map(p => `
                <div class="flex items-center gap-2 px-3 py-2 bg-slate-900/80 rounded-xl border border-slate-800">
                  <span class="w-2 h-2 rounded-full bg-blue-400"></span>
                  <span class="text-sm font-medium text-white">${p}</span>
                </div>
              `).join("")}
            </div>
          </div>

          <div class="bg-slate-950/70 border border-emerald-500/30 rounded-2xl p-4">
            <div class="flex items-center gap-2 mb-3">
              <div class="w-8 h-8 rounded-full bg-emerald-500/20 border border-emerald-500/40 flex items-center justify-center text-sm font-bold text-emerald-400">2</div>
              <h3 class="font-bold text-white">Equipo 2</h3>
              <span class="text-xs text-slate-500 ml-auto">${team2.length}</span>
            </div>
            <div class="space-y-2">
              ${team2.map(p => `
                <div class="flex items-center gap-2 px-3 py-2 bg-slate-900/80 rounded-xl border border-slate-800">
                  <span class="w-2 h-2 rounded-full bg-emerald-400"></span>
                  <span class="text-sm font-medium text-white">${p}</span>
                </div>
              `).join("")}
            </div>
          </div>
        </div>
      `;

      document.getElementById("result-content").innerHTML = html;
      document.getElementById("result-section").classList.remove("hidden");
    }

    // ========== COPIAR ==========
    function copyResult() {
      if (!lastResult) {
        alert("Primero armá los equipos");
        return;
      }

      let text = "";

      if (lastResult.type === "truco") {
        text += `🃏 Equipos de Truco (${lastResult.mode})\n`;
        text += `🌐 https://laranchada.vercel.app\n\n`;

        lastResult.matches.forEach((m, i) => {
          text += `📌 Partido ${i + 1}\n`;
          text += `🔵 Equipo A: ${m.teamA.join(", ")}\n`;
          text += `🔷 Equipo B: ${m.teamB.join(", ")}\n\n`;
        });

        if (lastResult.waitingTeam) {
          text += `⏳ Esperando: ${lastResult.waitingTeam.join(", ")}\n\n`;
        }
        if (lastResult.sitOut.length > 0) {
          text += `😴 Quedan afuera: ${lastResult.sitOut.join(", ")}\n`;
        }
      } else {
        text += `⚽ Equipos de Papi\n`;
        text += `🌐 https://laranchada.vercel.app\n\n`;
        text += `🔵 Equipo 1:\n`;
        lastResult.team1.forEach(p => text += `• ${p}\n`);
        text += `\n🟢 Equipo 2:\n`;
        lastResult.team2.forEach(p => text += `• ${p}\n`);
      }

      navigator.clipboard.writeText(text).then(() => {
        alert("¡Equipos copiados! Pegalo en el grupo");
      }).catch(() => {
        prompt("Copiá este texto:", text);
      });
    }

    // Enter para agregar
    document.getElementById("new-person").addEventListener("keydown", e => {
      if (e.key === "Enter") addPerson();
    });

    load();
  </script>
</body>
</html>
