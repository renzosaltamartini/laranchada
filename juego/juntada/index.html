<!DOCTYPE html>
<html lang="es" class="h-full bg-[#050914] text-slate-100 selection:bg-blue-500 selection:text-slate-950">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Juntada · LaRanchada Web</title>

  <!-- CDN Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Fuente Poppins -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Poppins', sans-serif;
      background-color: #050914;
      background-image:
        radial-gradient(ellipse 80% 50% at 15% -10%, rgba(59,130,246,0.20), transparent),
        radial-gradient(ellipse 60% 40% at 100% 10%, rgba(56,189,248,0.14), transparent),
        radial-gradient(ellipse 70% 50% at 50% 120%, rgba(37,99,235,0.16), transparent);
      background-attachment: fixed;
    }

    body::before {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;

    background:
        repeating-radial-gradient(
            circle at 0 0,
            rgba(255,255,255,.015) 0,
            rgba(255,255,255,.015) 1px,
            transparent 2px,
            transparent 4px
        );

    opacity: .7;
}

    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(59,130,246,0.35); border-radius: 999px; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(59,130,246,0.55); }

    /* Animación de los puntos flotantes (rebotan sin perder el gradiente) */
    @keyframes bounceDot {
      0%, 100% {
        transform: translateY(0);
      }
      50% {
        transform: translateY(-8px);
      }
    }

    .dot-bounce {
      display: inline-block;
      animation: bounceDot 1.2s infinite ease-in-out;
    }

    .dot-1 { animation-delay: 0s; }
    .dot-2 { animation-delay: 0.2s; }
    .dot-3 { animation-delay: 0.4s; }
  </style>
</head>
<body class="min-h-full flex flex-col justify-between p-4 sm:p-6 lg:p-8 relative">

  <!-- Header -->
  <header class="max-w-4xl w-full mx-auto flex justify-between items-center pb-4 sm:pb-6 border-b border-slate-800">
    <a href="/" class="flex items-center gap-2 text-slate-400 hover:text-white transition group">
      <svg class="w-4 h-4 group-hover:-translate-x-0.5 transition" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>
      <span class="text-[10px] sm:text-xs font-semibold tracking-wider uppercase">Inicio</span>
    </a>
  </header>

  <!-- Contenido Principal -->
  <main class="max-w-4xl w-full mx-auto my-auto py-8 sm:py-12">

    <!-- Branding -->
    <div class="text-center mb-6 sm:mb-8 flex flex-col items-center">
      
      <!-- Badge con punto titilante de "En Construcción" -->
      <div class="inline-flex items-center gap-2 px-3 py-1 mb-4 text-[10px] sm:text-xs font-semibold uppercase tracking-widest text-blue-300 bg-blue-500/10 border border-blue-500/25 rounded-full shadow-[0_0_20px_-6px_rgba(59,130,246,0.6)]">
        <span class="relative flex h-2 w-2">
          <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-sky-400 opacity-75"></span>
          <span class="relative inline-flex rounded-full h-2 w-2 bg-sky-500"></span>
        </span>
        Hecho por Perico
      </div>

      <!-- Título con alternativa de texto y los puntos arreglados -->
      <h1 class="text-3xl sm:text-4xl md:text-5xl font-extrabold tracking-tight text-white drop-shadow-[0_2px_20px_rgba(37,99,235,0.35)]">
        Seccion en desarrollo<span class="inline-flex text-sky-400 ml-1">
          <span class="dot-bounce dot-1">.</span>
          <span class="dot-bounce dot-2">.</span>
          <span class="dot-bounce dot-3">.</span>
        </span>
      </h1>

    </div>
  </main>

  <!-- Footer -->
  <footer class="max-w-4xl w-full mx-auto pt-4 sm:pt-6 border-t border-slate-800 text-center">
    <p class="text-[10px] sm:text-xs text-slate-600">LaRanchada Web &middot; Hecho con 💙 por Perico</p>
  </footer>

</body>
</html>
